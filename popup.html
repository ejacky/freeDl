<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreeDl - 视频下载器</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>
                <svg class="header-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M21.582 6.428l-9-6a1 1 0 00-.992 0l-9 6A1 1 0 002 7v10a2 2 0 002 2h16a2 2 0 002-2V7a1 1 0 00-.418-0.772zM12 4.713L18.01 8H19v2h-2.59l-2.01 2h2.6l2 2h-3.61l-2 2H15v2h-2v-2h-2v2H9v-2H6.41l-2-2h2.61l2-2H6v-2h2.59l2.01-2H5V8h2.01L12 4.713z">
                    </path>
                </svg>
                FreeDl - 视频下载器
            </h1>
        </div>

        <div class="content">
            <div id="status" class="status info hidden fade-in">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"
                    style="display: inline-block; margin-right: 8px; vertical-align: middle;">
                    <path
                        d="M8 1C4.13401 1 1 4.13401 1 8C1 11.866 4.13401 15 8 15C11.866 15 15 11.866 15 8C15 4.13401 11.866 1 8 1ZM8 13.5C5.41015 13.5 3.5 11.5899 3.5 9C3.5 6.41015 5.41015 4.5 8 4.5C10.5899 4.5 12.5 6.41015 12.5 9C12.5 11.5899 10.5899 13.5 8 13.5ZM8 5.5C6.067 5.5 4.5 7.067 4.5 9C4.5 10.933 6.067 12.5 8 12.5C9.933 12.5 11.5 10.933 11.5 9C11.5 7.067 9.933 5.5 8 5.5ZM7.5 7V9.5L9.5 10.5L10 10.5L10 7L7.5 7Z"
                        fill="currentColor"></path>
                </svg>
                正在检测页面中的视频...
            </div>
            <div id="videoInfo" class="video-details hidden fade-in">
                <h3>
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M12.0833 3.08333L8.5 4.75V9.25L12.0833 10.9167V3.08333ZM6.5 1.58333L1.91667 3.5V10.5L6.5 12.4167V1.58333ZM7 2.83333V11.1667L3.08333 9.5V4.5L7 2.83333Z"
                            fill="currentColor"></path>
                    </svg>
                    检测到的视频 <span id="videoCountText" class="count-badge"></span>
                </h3>
                <div id="videoUrl" class="video-url"></div>
            </div>

            <div class="action-section">
                <button id="downloadBtn" class="btn btn-primary" disabled>
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M8 2.5L4.5 6L5.25 6.75L7.5 4.5V12.5H8.5V4.5L10.75 6.75L11.5 6L8 2.5ZM1.5 13.5H14.5V14.5H1.5V13.5Z"
                            fill="currentColor"></path>
                    </svg>
                    开始下载
                </button>
            </div>

            <!-- Debugging controls -->
            <div class="debug-section"
                style="margin-top: 10px; padding: 10px; background: #f0f0f0; border-radius: 5px;">
                <button id="testStreamBtn" class="btn btn-secondary" style="font-size: 12px; padding: 5px 10px;">
                    Test Stream Download
                </button>
                <div id="debugInfo" style="margin-top: 5px; font-size: 11px; color: #666;"></div>
            </div>

            <div id="progressContainer" class="progress-section hidden fade-in">
                <div class="progress-container">
                    <div id="progressFill" class="progress-bar" style="width: 0%"></div>
                </div>
                <div class="progress-info">
                    <span id="progressText">准备下载...</span>
                    <span id="progressPercentage">0%</span>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>
                支持 m3u8 格式视频下载 |
                <a href="#" target="_blank">使用帮助</a> |
                <a id="manualDetectLink" href="#" style="color: var(--text-tertiary);" title="当自动检测未捕获时可手动刷新">刷新检测结果</a>
            </p>
        </div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
